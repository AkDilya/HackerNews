server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все маршруты react-router отдают index.html
    location / {
        try_files $uri /index.html;
    }

    # Кэш для хэшированных бандлов, без кэша для index.html
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
